<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-card">
    <h1>Number Guessing Game</h1>
    <p class="instructions">Guess a number between 1 and 100</p>

    <div class="input-section">
      <input
        type="number"
        id="guessInput"
        placeholder="Enter your guess"
        min="1"
        max="100"
      />
      <button id="guessBtn">Guess</button>
    </div>

    <!-- This is where feedback messages ("Too high", "Too low", etc.) appear -->
    <p id="resultMessage" class="result-message"></p>

    <p class="attempts">Attempts: <span id="attemptsCount">0</span></p>

    <button id="newGameBtn" class="new-game-btn">New Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
